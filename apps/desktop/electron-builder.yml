appId: br.com.itacondo.icchat
electronVersion: 44.4.5
productName: IC Chat
copyright: Copyright © 2026 ItaCondo
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!out/web/**'
# O ffmpeg (conversão de áudio do WhatsApp) precisa ficar fora do .asar para ser executado
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
# Segurança do executável: não roda como Node, ignora NODE_OPTIONS/--inspect,
# só carrega o app de dentro do .asar e confere a integridade dele
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Sem módulos nativos para recompilar
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: IC-Chat-Setup-${version}.${ext}
portable:
  artifactName: IC-Chat-Portatil-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: IC Chat
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
# macOS preparado para o futuro (build universal Intel + Apple Silicon)
mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.business
