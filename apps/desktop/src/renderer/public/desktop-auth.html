<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concluindo acesso ao IC Chat</title>
    <style>body{font:16px system-ui,sans-serif;background:#f5f7fb;color:#10203a;display:grid;place-items:center;min-height:90vh}main{text-align:center}</style>
  </head>
  <body>
    <main><h1>Concluindo seu acesso</h1><p>Você pode fechar esta página depois que o IC Chat abrir.</p></main>
    <script>
      const params = new URLSearchParams(location.hash.slice(1))
      const access = params.get('access_token')
      const refresh = params.get('refresh_token')
      if (access && refresh && access.length < 8192 && refresh.length < 4096) {
        location.replace(`icchat://auth/callback?access_token=${encodeURIComponent(access)}&refresh_token=${encodeURIComponent(refresh)}`)
      } else {
        document.querySelector('p').textContent = 'Não foi possível concluir o acesso. Volte ao IC Chat e tente novamente.'
      }
    </script>
  </body>
</html>
